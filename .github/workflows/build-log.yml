name: Update Build Log

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/build-log.yml"

permissions:
  contents: write

jobs:
  build-log:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub activity
        uses: lowlighter/metrics@latest
        with:
          user: antoniusjairus4
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/build-log.svg

          template: classic
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata

          plugin_calendar: yes
          plugin_calendar_limit: 1

          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_filter: push, pr, issue, release, ref/create
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          output_action: commit
          committer_branch: main
          committer_message: "chore(metrics): update build log"
