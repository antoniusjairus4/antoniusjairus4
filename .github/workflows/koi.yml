name: Update Profile Koi

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/koi.yml"

permissions:
  contents: write

concurrency:
  group: profile-koi
  cancel-in-progress: false

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Render Git Koi from public contribution history
        uses: yalongwastaken/git-koi@v1
        with:
          login: antoniusjairus4
          body: asagi
          output-dir: koi

      - name: Crop unused space around the animated koi
        shell: bash
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image, ImageChops, ImageSequence
          from pathlib import Path

          path = Path("koi/koi.gif")
          with Image.open(path) as source:
              frames = [frame.copy().convert("RGBA") for frame in ImageSequence.Iterator(source)]
              durations = [frame.info.get("duration", source.info.get("duration", 100)) for frame in ImageSequence.Iterator(source)]
              loop = source.info.get("loop", 0)

          bounds = None
          width, height = frames[0].size
          for frame in frames:
              alpha = frame.getchannel("A")
              if alpha.getextrema()[0] < 255:
                  mask = alpha.point(lambda v: 255 if v > 20 else 0)
              else:
                  rgb = frame.convert("RGB")
                  corner = rgb.getpixel((0, 0))
                  diff = ImageChops.difference(rgb, Image.new("RGB", rgb.size, corner))
                  mask = diff.convert("L").point(lambda v: 255 if v > 18 else 0)
              box = mask.getbbox()
              if box:
                  if bounds is None:
                      bounds = box
                  else:
                      bounds = (min(bounds[0], box[0]), min(bounds[1], box[1]),
                                max(bounds[2], box[2]), max(bounds[3], box[3]))

          if bounds:
              margin = 10
              bounds = (max(0, bounds[0]-margin), max(0, bounds[1]-margin),
                        min(width, bounds[2]+margin), min(height, bounds[3]+margin))
              if bounds != (0, 0, width, height):
                  cropped = [frame.crop(bounds) for frame in frames]
                  cropped[0].save(path, save_all=True, append_images=cropped[1:],
                                  duration=durations, loop=loop, disposal=2, optimize=True)
                  print(f"Cropped koi GIF from {width}x{height} to {cropped[0].size}")
              else:
                  print("Koi GIF already fits its canvas.")
          PY

      - name: Commit koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "Koi unchanged, no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(koi): redraw activity koi"
          git push
