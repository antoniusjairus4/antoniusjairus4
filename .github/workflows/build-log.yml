name: Update Build Log

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/render_profile.py"
      - ".github/workflows/build-log.yml"

permissions:
  contents: write

concurrency:
  group: profile-build-log
  cancel-in-progress: false

jobs:
  build-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight image renderer
        run: python -m pip install "Pillow>=10,<13"

      - name: Regenerate live profile assets
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python scripts/render_profile.py

      - name: Commit only if generated visuals changed
        shell: bash
        run: |
          git add assets/hero.svg assets/build-log.svg assets/project-loop.gif assets/contact-loop.gif
          if git diff --cached --quiet; then
            echo "Profile visuals already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh live contribution dashboard"
          git push
