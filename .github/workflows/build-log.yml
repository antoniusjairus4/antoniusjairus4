
name: Update Build Log

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-log:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub activity
        uses: lowlighter/metrics@latest
        with:
          user: antoniusjairus4
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/build-log.svg

          template: classic
          base: ""
          config_display: large
          config_timezone: Asia/Kolkata

          plugin_calendar: yes
          plugin_calendar_limit: 1

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 30
          plugin_activity_filter: push, pr, issue, release, ref/create
          plugin_activity_visibility: public
          plugin_activity_timestamps: yes

          output_action: commit
