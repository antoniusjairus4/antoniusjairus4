name: Update Commit Pet

on:
  workflow_dispatch:
  schedule:
    # Daily at 01:15 UTC (06:45 India Standard Time)
    - cron: "15 1 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/commit-pet.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-commit-pet
  cancel-in-progress: false

jobs:
  update-pet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Checkout Commit Pet generator
        uses: actions/checkout@v4
        with:
          repository: yukurash/commit-pet
          ref: v1
          path: .commit-pet-generator
          persist-credentials: false

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate animated cyan pet from real contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .commit-pet-generator/src/generate.js \
            --user antoniusjairus4 \
            --species cat \
            --name Byte \
            --theme en \
            --out assets/commit-pet.svg

          test -s assets/commit-pet.svg
          grep -q '<svg' assets/commit-pet.svg
          grep -q 'Byte' assets/commit-pet.svg
          grep -q '<animate' assets/commit-pet.svg

      - name: Match the profile's blue-cyan-mint palette
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("assets/commit-pet.svg")
          svg = path.read_text(encoding="utf-8")
          replacements = {
              "#1b2030": "#101e2d",
              "#11151f": "#0b111a",
              "#2c3346": "#234457",
              "#0d1018": "#102432",
              "#ffd166": "#75e8ba",
              "#3a3f55": "#1b3748",
              "#f4f6ff": "#e7f6ff",
              "#9aa7c7": "#8eafc0",
              "#cdd6ef": "#cbeaf3",
              "#7e8aa8": "#8eafc0",
              "#6b76a0": "#78b5c6",
          }
          for old, new in replacements.items():
              svg = svg.replace(old, new)
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit changed pet graphic only
        shell: bash
        run: |
          set -euo pipefail
          git add assets/commit-pet.svg
          if git diff --cached --quiet; then
            echo "Pet is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh animated Commit Pet"
          git push
